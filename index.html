<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGNALS AI TRADING</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="status-dot"></span>
                <span class="header-title">SIGNALS <span class="dot-separator">&middot;</span> AI</span>
            </div>
            <div class="header-right">
                <div class="user-badge">
                    <span class="user-avatar">CO</span>
                    <span class="user-label">COLECALL<br><small>PRO</small></span>
                </div>
            </div>
        </header>

        <!-- Symbol Selector -->
        <div class="symbol-selector">
            <div class="symbol-dropdown">
                <span class="symbol-label">SYMBOL</span>
                <select id="symbolSelect">
                    <option value="ALL">All Symbols</option>
                    <option value="XAUUSD">XAUUSD (Gold)</option>
                    <option value="EURUSD">EURUSD</option>
                    <option value="GBPUSD">GBPUSD</option>
                    <option value="USDJPY">USDJPY</option>
                    <option value="BTCUSD">BTCUSD</option>
                    <option value="ETHUSD">ETHUSD</option>
                </select>
            </div>
            <button class="reset-btn" id="resetBtn">Reset</button>
        </div>

        <!-- Signal Cards Container -->
        <div id="signalCards" class="signal-cards">
            <!-- Signal cards will be inserted here -->
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item" data-tab="package">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 4h4v3h-4V4z"/>
                </svg>
                <span>PACKAGE</span>
            </button>
            <button class="nav-item active" data-tab="signals">
                <div class="nav-center-btn">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <span>SINYAL</span>
            </button>
            <button class="nav-item" data-tab="profile">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span>PROFILE</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
